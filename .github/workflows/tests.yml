name: ATLAS OS checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check JavaScript syntax
        run: for f in frontend/static/*.js netlify/lib/*.mjs netlify/functions/*.mjs scripts/netlify/*.mjs; do node --check "$f"; done
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the Netlify site
        run: node scripts/netlify/build.mjs
      - name: Function tests (fake model providers)
        run: node --test netlify/tests/cloud.test.mjs netlify/tests/attack.test.mjs netlify/tests/budget.test.mjs
      - name: Browser tests of the web app (FAKE model)
        run: node --test netlify/tests/e2e.test.mjs
      - name: Dependency audit
        run: npm audit --omit=dev
      - name: Secret scan (fails on any finding outside tests)
        run: |
          python3 -m pip install --quiet detect-secrets
          detect-secrets scan --all-files --exclude-files '(^|/)(\.git|node_modules|dist|tests)/' > secrets.json
          python3 -c "import json,sys; r=json.load(open('secrets.json'))['results']; print(json.dumps({k:[x['type'] for x in v] for k,v in r.items()})); sys.exit(1 if r else 0)"
